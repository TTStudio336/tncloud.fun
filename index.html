<!doctype html>
<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>やわらかな光</title>
    <!-- Core framework and template styles -->
    <link rel="stylesheet" href="assets/css/index.css" />
    <!-- Site layout -->
    <link
      rel="stylesheet"
      href="assets/css/site.css"
      media="screen and (max-device-width: 8192px)"
    />
    <link
      rel="stylesheet"
      href="assets/css/site-770.css"
      media="screen and (max-device-width: 770px)"
    />
    <style>
      body {
        background-color: #1473d2;
      }
    </style>
  </head>
  <body>
    <!--Header START-->
    <header class="kayden-header sticky-top">
      <div class="header-inside transparent_header">
        <div class="d-flex flex-row justify-content-between align-items-center">
          <!--Header Logo START-->
          <div class="kayden-logo">
            <img src="Motziki.jpg" height="50" alt="logo" />
          </div>
          <!--Header Logo END--><!--Header Info START-->
          <div class="kayden-nav-meta fs-5 fw-bold d-none d-sm-block text-end">
            やわらかな光
          </div>
          <!--Header Info END-->
        </div>
      </div>
    </header>
    <!--Header END--><!--Home Section START-->
    <section id="home" class="home vh-100">
      <!--Home Background START-->
      <div
        class="home-background position-absolute top-0 start-0 w-100 h-100"
        style="background: linear-gradient(135deg, #046bc0)"
      ></div>
      <!--Home Background END--><!--Home Container START-->
      <div class="container h-100 position-relative">
        <div
          class="home-details text-center text-sm-end w-100 h-100 d-flex align-items-center"
        >
          <div class="home-details-inner w-100">
            <p class="welcome_text fs-4">
              <span
                class="typed_text"
                data-options="Web Developer,Programmer"
              ></span>
            </p>
            <span
              class="fs-1 fw-bold kayden-underline-center kayden-underline-sm-right kayden-underline-big d-inline-block"
            >
              I'm やわらかな光
            </span>
          </div>
        </div>
      </div>
      <!--Home Container END-->
    </section>
    <!--Home Section END-->
    <!-- 页脚 -->
    <div id="footer">
      <center>
        <!-- Typed.js v3.0.0 is distributed under GPL-3.0. -->
        <script src="assets/js/typed.umd.js"></script>

        <div style="text-align: center; font-weight: bold; color: #1bc3fb">
          <span id="subtitle1"></span>
        </div>
        <script>
          new Typed(".typed_text", {
            strings: document
              .querySelector(".typed_text")
              .dataset.options.split(","),
            typeSpeed: 90,
            backDelay: 2000,
            backSpeed: 40,
            loop: true,
          });

          new Typed("#subtitle1", {
            strings: [
              "Live a good life, write some good code !!!",
              "没有伞的孩子必须努力奔跑！",
              "愿自己的努力终将获得回报。",
              "花开不是为了花落，而是为了开的更加灿烂。",
              "欲望以提升热忱，毅力以磨平高山。",
              "如果放弃太早，你永远都不知道自己会错过什么。",
              "没有礁石，就没有美丽的浪花；没有挫折，就没有壮丽的人生。",
            ],
            startDelay: 1000,
            typeSpeed: 100,
            loop: true,
            backSpeed: 60,
            backDelay: 2000,
          });
        </script>
        <p>
          风吹来故事的种子，时间使之发芽。<a href="https://ys.mihoyo.com/main/"
            >《原神》</a
          >
        </p>
      </center>
    </div>
  </body>
</html>
